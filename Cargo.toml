[package]
name = "Grand-Theft-Gatcha"
version = "0.0.1"
edition = "2024"

[dependencies]
serenity = { version = "0.11", features = ["client", "gateway", "rustls_backend", "model", "framework", "standard_framework", "cache"] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "fs"] }
dotenv = "0.15.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.13.0"
chrono = "0.4"
futures = "0.3"
